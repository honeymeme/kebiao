<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排空课表工具</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-2:#1d4ed8;
    --ok:#059669; --warn:#b45309; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; padding:0 0 60px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px}
  header h1{font-size:22px;margin:6px 0 4px}
  header p{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
        font-size:12px;align-items:center;justify-content:center;font-weight:600}
  #drop{
    border:2px dashed #cbd5e1;border-radius:12px;padding:26px 16px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s;background:#fafbfc
  }
  #drop.over{border-color:var(--accent);background:#eff6ff;color:var(--accent)}
  #drop strong{color:var(--ink);display:block;margin-bottom:6px;font-size:15px}
  #drop small{font-size:12.5px;line-height:1.6}
  button{
    font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;
    background:var(--accent);color:#fff;font-weight:600;font-size:15px
  }
  button:hover{background:var(--accent-2)}
  button:disabled{background:#c7cdd6;cursor:not-allowed}
  button.ghost{background:#eef2ff;color:var(--accent-2)}
  button.ghost:hover{background:#e0e7ff}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:4px}
  .dept{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfcfd}
  .dept .n{font-weight:600;font-size:14px}
  .dept .c{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
  .problems{margin:12px 0 0;padding:12px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px}
  .problems li{color:var(--bad);font-size:13px;line-height:1.6;margin:2px 0}
  .okbar{background:#ecfdf5;border-color:#a7f3d0;color:var(--ok)}
  .muted{color:var(--muted);font-size:13px;line-height:1.6}
  select{
    font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink)
  }
  .dl{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .dl a{
    flex:1 1 200px;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
    padding:13px 16px;border-radius:10px;font-weight:600;font-size:15px
  }
  .dl a:hover{background:var(--accent-2)}
  .warns{margin-top:12px}
  .warns div{font-size:13px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;
             border-radius:9px;padding:8px 12px;margin-top:6px;line-height:1.5}
  #wakeTip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;
           max-width:min(92vw,480px);background:#1f2937;color:#fff;border-radius:12px;
           padding:12px 14px;font-size:13.5px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.18);
           display:none;align-items:flex-start;gap:10px}
  #wakeTip.show{display:flex}
  #wakeTip button{background:#374151;color:#fff;padding:6px 10px;font-size:12.5px;border-radius:8px;flex:0 0 auto}
  #wakeTip button:hover{background:#4b5563}
  .hide{display:none !important}
  .spinner{width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;
           display:inline-block;vertical-align:-3px;margin-right:6px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:520px){
    .wrap{padding:14px 12px}
    .card{padding:14px}
    header h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>排空课表工具</h1>
    <p>上传各部门课表压缩包 → 自动检查格式 → 选择周次 → 生成九个部门的空课表和每周系办值班表。</p>
  </header>

  <section class="card">
    <h2><span class="step">1</span>上传课表压缩包</h2>
    <div id="drop">
      <strong>把 ZIP 拖到这里，或点一下选择（可一次选多个）</strong>
      <small>压缩包里按部门分文件夹（如「青协课表/」），部长放在「部长/」子文件夹<br>文件名格式：部门 姓名 班级 联系方式</small>
    </div>
    <input id="file" type="file" accept=".zip" multiple class="hide">
    <div id="status" class="muted" style="margin-top:10px"></div>
    <div id="report"></div>
  </section>

  <section class="card hide" id="cfg">
    <h2><span class="step">2</span>选择周次</h2>
    <div class="row">
      <label class="muted">从第 <select id="w1"></select> 周</label>
      <label class="muted">到第 <select id="w2"></select> 周</label>
      <span id="wsum" class="muted"></span>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="go">开始生成</button>
    </div>
    <div id="genStatus" class="muted" style="margin-top:10px"></div>
  </section>

  <section class="card hide" id="result">
    <h2><span class="step">3</span>下载结果</h2>
    <div id="resultBody"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#file');

function fillWeeks(){
  const opts = [];
  for (let i = 1; i <= 30; i++) opts.push('<option value="' + i + '">' + i + '</option>');
  $('#w1').innerHTML = opts.join('');
  $('#w2').innerHTML = opts.join('');
  $('#w1').value = 1; $('#w2').value = 18;
}
fillWeeks();
function sumWeeks(){
  const a = +$('#w1').value, b = +$('#w2').value;
  if (a > b) { $('#wsum').textContent = '起始周不能大于结束周'; return; }
  $('#wsum').textContent = '共 ' + (b - a + 1) + ' 周';
}
$('#w1').onchange = sumWeeks; $('#w2').onchange = sumWeeks; sumWeeks();

drop.onclick = () => fileInput.click();
fileInput.onchange = () => { uploadMany([...fileInput.files]); };
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', ev => {
  const fs = ev.dataTransfer.files ? [...ev.dataTransfer.files] : [];
  if (fs.length) uploadMany(fs);
});

let jobId = null;

async function uploadMany(files){
  const zips = files.filter(f => f.name.toLowerCase().endsWith('.zip'));
  if (!zips.length) {
    $('#status').textContent = '请上传 .zip 压缩包';
    return;
  }
  $('#report').innerHTML = ''; $('#cfg').classList.add('hide'); $('#result').classList.add('hide');
  jobId = null;
  const names = [];
  let data = null;
  try{
    for (let i = 0; i < zips.length; i++){
      $('#status').innerHTML = '<span class="spinner" style="border-color:#2563eb;border-right-color:transparent"></span>'
        + '正在上传（' + (i + 1) + '/' + zips.length + '）：' + zips[i].name;
      const url = jobId ? ('/api/add?job=' + jobId + '&defer=1') : '/api/upload?defer=1';
      const res = await fetch(url, {method:'POST', body: zips[i]});
      data = await res.json();
      if (!res.ok) throw new Error((zips[i].name + '：') + (data.error || '上传失败'));
      jobId = data.job;
      names.push(zips[i].name);
    }
    $('#status').innerHTML = '<span class="spinner" style="border-color:#2563eb;border-right-color:transparent"></span>'
      + '正在解析课表、检查格式（' + names.length + ' 个压缩包）…';
    const cr = await fetch('/api/check?job=' + jobId, {method:'POST'});
    const report = await cr.json();
    if (!cr.ok) throw new Error(report.error || '检查失败');
    renderReport(report, names);
  }catch(err){
    $('#status').textContent = '出错了：' + err.message;
  }
}

function renderReport(d, names){
  jobId = d.job;
  $('#status').innerHTML = '已上传 ' + names.length + ' 个压缩包：<b>' + names.join('</b>、<b>') + '</b>';
  let html = '<div class="depts">';
  for (const dep of d.depts){
    html += '<div class="dept"><div class="n">' + dep.dept + '</div><div class="c">'
         + dep.count + ' 人 · 部长 ' + dep.ministers.length + ' 人'
         + (dep.ministers.length ? '<br>' + dep.ministers.join('、') : '') + '</div></div>';
  }
  html += '</div>';
  if (d.problems && d.problems.length){
    html += '<div class="problems"><b>需要先处理这些问题：</b><ul>';
    for (const p of d.problems) html += '<li>' + p + '</li>';
    html += '</ul><div class="muted">修好文件后重新上传即可。</div></div>';
  } else {
    html += '<div class="problems okbar" style="margin-top:12px">格式检查通过，共 '
         + d.total + ' 人、' + d.depts.length + ' 个部门。</div>';
    $('#cfg').classList.remove('hide');
  }
  $('#report').innerHTML = html;
  sumWeeks();
}

$('#go').onclick = async () => {
  if (!jobId) return;
  const a = +$('#w1').value, b = +$('#w2').value;
  if (a > b) { $('#genStatus').textContent = '起始周不能大于结束周'; return; }
  $('#go').disabled = true;
  $('#genStatus').innerHTML = '<span class="spinner" style="border-color:#2563eb;border-right-color:transparent"></span>正在生成，请稍候…';
  try{
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({job: jobId, start: a, end: b})
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || '生成失败');
    renderResult(d);
    $('#genStatus').textContent = '生成完成。';
  }catch(err){
    $('#genStatus').textContent = '出错了：' + err.message;
  }finally{
    $('#go').disabled = false;
  }
};

// 冷启动提醒：如果这次打开等很久，多半是服务器刚从休眠中唤醒
window.addEventListener('load', () => {
  const t = performance.timing
    ? performance.timing.loadEventEnd - performance.timing.navigationStart : 0;
  if (t > 6000) {
    const el = document.createElement('div');
    el.id = 'wakeTip';
    el.innerHTML = '<div>服务器刚从休眠中被唤醒（免费版第一次打开要 30–60 秒），现在已就绪，'
      + '之后再打开会很快。</div><button>知道了</button>';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    el.querySelector('button').onclick = () => el.remove();
    setTimeout(() => el.remove(), 15000);
  }
});

function renderResult(d){
  let html = '<div class="muted" style="margin-bottom:12px">周次：第 ' + d.weeks.replace('-', ' – ') + ' 周 · '
           + d.depts.length + ' 个部门 · 值班表 ' + d.duty_weeks + ' 张</div>';
  if (d.stats) {
    const s = d.stats;
    html += '<div class="muted" style="margin-bottom:12px">每人排班次数：平均 ' + s.avg
          + ' 次，最少 ' + s.min + ' 次，最多 ' + s.max + ' 次'
          + (s.zero && s.zero.length ? '<br><span style="color:#b45309">没排到的人：' + s.zero.join('、') + '</span>' : '')
          + '</div>';
  }
  html += '<div class="dl"><a href="' + d.empty + '">下载 空课表.zip</a>'
        + '<a href="' + d.duty + '">下载 值班表.zip</a></div>';
  if (d.warnings && d.warnings.length){
    html += '<div class="warns"><b class="muted">需要注意：</b>';
    for (const w of d.warnings) html += '<div>' + w + '</div>';
    html += '</div>';
  }
  $('#resultBody').innerHTML = html;
  $('#result').classList.remove('hide');
  $('#result').scrollIntoView({behavior:'smooth', block:'nearest'});
}
</script>
</body>
</html>
